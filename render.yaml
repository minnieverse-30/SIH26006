databases:
  - name: sayliv-db
    region: singapore
    plan: free
    databaseName: sayliv
    user: sayliv

services:
  - type: web
    name: sayliv-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: sayliv-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: sayliv-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: sayliv-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: sayliv-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

